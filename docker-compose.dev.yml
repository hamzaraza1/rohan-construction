# Local development database only (the app runs with `npm run dev` on the host).
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_NAME: rohan
      APP_OWNER_PASSWORD: devpass
      APP_READONLY_PASSWORD: devro
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
volumes:
  pgdata-dev:
