# Production stack for the Hostinger VPS.  Usage: see docs/05-deployment.md
#   cp .env.production.example .env.production   (fill in secrets)
#   docker compose --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      # The superuser is only for maintenance. The app uses the non-superuser
      # roles created by init-roles.sh, so database permission triggers apply.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env.production}
      POSTGRES_DB: postgres
      APP_DB_NAME: rohan
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?set in .env.production}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?set in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rohan"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published on the host: only reachable from the other containers.

  migrate:
    build: { context: ., target: builder }
    environment:
      DATABASE_URL: postgresql://rc_owner:${APP_OWNER_PASSWORD}@postgres:5432/rohan?schema=public
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Hamza}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-hamza}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: ["npm", "run", "db:deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rc_owner:${APP_OWNER_PASSWORD}@postgres:5432/rohan?schema=public&connection_limit=10
      DATABASE_READONLY_URL: postgresql://rc_readonly:${APP_READONLY_PASSWORD}@postgres:5432/rohan?schema=public&connection_limit=10
      UPLOAD_DIR: /app/storage/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
